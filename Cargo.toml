[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yeoleobun/minipbx"

[workspace.dependencies]
siphora = { path = "crates/siphora", version = "0.1" }
octothorpe = { path = "crates/octothorpe", version = "0.1" }
nom = "8"
thiserror = "2"
